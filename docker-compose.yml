version: '3.8'
services:
  mysql:
    image: mysql:8.0.32
    container_name: homework_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 835900lyh
      MYSQL_DATABASE: yh_dianping
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  mysql-slave:
    image: mysql:8.0.32
    container_name: homework_mysql_slave
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 835900lyh
      MYSQL_DATABASE: yh_dianping
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --relay-log=relay-bin
      --read-only=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - ./docker/mysql-slave/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:7.0.11
    container_name: homework_redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass lyh123
    volumes:
      - ./docker/redis/data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: homework_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lyh
      RABBITMQ_DEFAULT_PASS: admin
    restart: always

  backend1:
    build: .
    container_name: homework_backend_1
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - mysql-slave
      - redis
      - rabbitmq
    environment:
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql-slave:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
    restart: always

  backend2:
    build: .
    container_name: homework_backend_2
    ports:
      - "8082:8081"
    depends_on:
      - mysql
      - mysql-slave
      - redis
      - rabbitmq
    environment:
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql-slave:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
    restart: always

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile.nginx
    container_name: homework_nginx
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    restart: always
