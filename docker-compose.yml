version: '3.8'
services:
  mysql:
    image: mysql:8.0.32
    container_name: homework_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 835900lyh
      MYSQL_DATABASE: yh_dianping
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  mysql-slave:
    image: mysql:8.0.32
    container_name: homework_mysql_slave
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 835900lyh
      MYSQL_DATABASE: yh_dianping
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --relay-log=relay-bin
      --read-only=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    volumes:
      - ./docker/mysql-slave/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:7.0.11
    container_name: homework_redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass lyh123
    volumes:
      - ./docker/redis/data:/data
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  backend1:
    build: .
    container_name: homework_backend_1
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - mysql-slave
      - redis
      - kafka
    environment:
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql-slave:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: always

  backend2:
    build: .
    container_name: homework_backend_2
    ports:
      - "8082:8081"
    depends_on:
      - mysql
      - mysql-slave
      - redis
      - kafka
    environment:
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL=jdbc:mysql://mysql-slave:3306/yh_dianping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: always

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile.nginx
    container_name: homework_nginx
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    restart: always
