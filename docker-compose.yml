version: '3.8'
services:
  mysql:
    image: mysql:8.0.32
    container_name: homework_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 835900lyh
      MYSQL_DATABASE: yh_dianping
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:7.0.11
    container_name: homework_redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass lyh123
    volumes:
      - ./docker/redis/data:/data
    restart: always

  backend1:
    build: .
    container_name: homework_backend_1
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
    restart: always

  backend2:
    build: .
    container_name: homework_backend_2
    ports:
      - "8082:8081"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/yh_dianping?useSSL=false&serverTimezone=UTC
      - SPRING_REDIS_HOST=redis
    restart: always

  nginx:
    image: nginx:1.23
    container_name: homework_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
    restart: always
